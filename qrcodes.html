/* ========================================================
   QUANTIDADES
   ======================================================== */

const quantidades = {};


/* ========================================================
   ESCAPAR HTML
   ======================================================== */

function esc(s) {

  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ========================================================
   QUANDO O USUÁRIO ESCOLHER O PRÉDIO
   ======================================================== */

predioSelect.addEventListener(
  "change",
  function() {

    const predio =
      this.value;


    paginasDiv.innerHTML = "";


    if (!predio) {

      areaConfiguracao.style.display =
        "none";

      configuracaoSalas.innerHTML =
        "";

      return;

    }


    areaConfiguracao.style.display =
      "block";


    carregarSalasDoPredio(
      predio
    );

  }
);


/* ========================================================
   CARREGAR BLOCOS DO PRÉDIO
   ======================================================== */

function carregarSalasDoPredio(
  predio
) {

  configuracaoSalas.innerHTML =
    "";


  const dadosPredio =
    predios[predio];


  if (!dadosPredio) {
    return;
  }


  Object.keys(
    dadosPredio.blocos
  ).forEach(
    blocoCodigo => {

      const bloco =
        dadosPredio.blocos[
          blocoCodigo
        ];


      const blocoDiv =
        document.createElement("div");

      blocoDiv.className =
        "bloco-config";


      blocoDiv.innerHTML = `

        <div class="bloco-config-titulo">

          📍 ${esc(bloco.nome)}

        </div>

        <div class="lista-salas"></div>

      `;


      configuracaoSalas.appendChild(
        blocoDiv
      );


      const lista =
        blocoDiv.querySelector(
          ".lista-salas"
        );


      bloco.salas.forEach(
        sala => {

          const chave =
            `${predio}|||${blocoCodigo}|||${sala}`;


          quantidades[chave] =
            1;


          const linha =
            document.createElement("div");

          linha.className =
            "linha-sala";


          linha.innerHTML = `

            <span class="nome-sala">
              ${esc(sala)}
            </span>

            <input
              type="number"
              min="0"
              max="999"
              value="1"
              data-chave="${esc(chave)}"
              class="quantidade-qrcode"
            >

          `;


          lista.appendChild(
            linha
          );

        }
      );

    }
  );


  /* ======================================================
     EVENTO DAS QUANTIDADES
     ====================================================== */

  document
    .querySelectorAll(
      ".quantidade-qrcode"
    )
    .forEach(
      input => {

        input.addEventListener(
          "change",
          () => {

            let valor =
              parseInt(
                input.value,
                10
              );


            if (
              isNaN(valor) ||
              valor < 0
            ) {

              valor = 0;

            }


            if (valor > 999) {

              valor = 999;

            }


            input.value =
              valor;


            quantidades[
              input.dataset.chave
            ] = valor;

          }
        );

      }
    );

}


/* ========================================================
   DEFINIR TODAS
   ======================================================== */

function definirTodas(
  valor
) {

  document
    .querySelectorAll(
      ".quantidade-qrcode"
    )
    .forEach(
      input => {

        input.value =
          valor;

        quantidades[
          input.dataset.chave
        ] = valor;

      }
    );

}

  }


  /* ======================================================
     ATUALIZA QUANTIDADES
     ====================================================== */

  document
    .querySelectorAll(
      ".quantidade-qrcode"
    )
    .forEach(
      input => {

        let valor =
          parseInt(
            input.value,
            10
          );


        if (
          isNaN(valor) ||
          valor < 0
        ) {

          valor = 0;

        }


        if (valor > 999) {

          valor = 999;

        }


        input.value =
          valor;


        quantidades[
          input.dataset.chave
        ] = valor;

      }
    );


  /* ======================================================
     LIMPA RESULTADO ANTERIOR
     ====================================================== */

  paginasDiv.innerHTML =
    "";


  const antiga =
    document.getElementById(
      "barraImpressao"
    );


  if (antiga) {

    antiga.remove();

  }


  const dadosPredio =
    predios[predio];


  let totalQR =
    0;


  /* ======================================================
     CADA BLOCO
     ====================================================== */

  Object.keys(
    dadosPredio.blocos
  ).forEach(
    blocoCodigo => {

      const bloco =
        dadosPredio.blocos[
          blocoCodigo
        ];


      const itens =
        [];


      /* ==================================================
         MONTA A LISTA DE CÓPIAS
         ================================================== */

      bloco.salas.forEach(
        sala => {

          const chave =
            `${predio}|||${blocoCodigo}|||${sala}`;


          const quantidade =
            quantidades[chave] || 0;


          for (
            let i = 0;
            i < quantidade;
            i++
          ) {

            itens.push(
              sala
            );

          }

        }
      );


      totalQR +=
        itens.length;


      if (!itens.length) {

        return;

      }


      /* ==================================================
         CRIA PÁGINAS
         ================================================== */

      for (
        let i = 0;
        i < itens.length;
        i += CARDS_POR_PAGINA
      ) {


        const grupo =
          itens.slice(
            i,
            i + CARDS_POR_PAGINA
          );


        const numPagina =
          Math.floor(
            i / CARDS_POR_PAGINA
          ) + 1;


        const totalPaginas =
          Math.ceil(
            itens.length /
            CARDS_POR_PAGINA
          );


        const pagina =
          document.createElement(
            "div"
          );


        pagina.className =
          "pagina";


        pagina.innerHTML = `

          <div class="pagina-titulo">

            <h2>
              ${
                esc(bloco.nome)
              }

              ${
                totalPaginas > 1
                ? ` (${numPagina}/${totalPaginas})`
                : ""
              }
            </h2>

            <p>
              Sistema de Chamados Técnicos — NTI
            </p>

          </div>

          <div class="grid"></div>

        `;


        paginasDiv.appendChild(
          pagina
        );


        const grid =
          pagina.querySelector(
            ".grid"
          );


        /* ================================================
           CADA CARD
           ================================================ */

        grupo.forEach(
          (sala, idx) => {

            const card =
              document.createElement(
                "div"
              );


            card.className =
              "card";


            const qrId =
              `qr-${predio}-${blocoCodigo}-${numPagina}-${idx}-${Date.now()}`;


            card.innerHTML = `

              <div class="card-top">

                <span class="card-top-icon">
                  🔧
                </span>

                <span class="card-top-text">
                  CHAMADOS NTI
                </span>

              </div>


              <div class="card-body">

                <div
                  class="qrcode"
                  id="${qrId}"
                ></div>

                <div class="card-instrucao">

                  📱 Aponte a câmera do celular

                </div>

              </div>


              <div class="card-bottom">

                <span class="card-predio-badge">

                  🏛️ ${esc(predio)}

                </span>

                <br>

                <span class="card-bloco-badge">

                  📍 ${esc(bloco.nome)}

                </span>

                <div class="card-sala">

                  ${esc(sala)}

                </div>

              </div>

            `;


            grid.appendChild(
              card
            );


            /* ============================================
               URL DO QR CODE
               
               AGORA ENVIA:
               prédio
               bloco
               sala
               ============================================ */

            const url =
              `${URL_BASE}` +
              `?predio=${encodeURIComponent(predio)}` +
              `&bloco=${encodeURIComponent(blocoCodigo)}` +
              `&sala=${encodeURIComponent(sala)}`;


            console.log(
              "QR Code:",
              url
            );


            new QRCode(
              document.getElementById(
                qrId
              ),
              {

                text: url,

                width: 140,

                height: 140,

                colorDark: "#1a0000",

                colorLight: "#ffffff",

                correctLevel:
                  QRCode.CorrectLevel.H

              }
            );

          }
        );

      }

    }
  );


  /* ======================================================
     NENHUM QR CODE
     ====================================================== */

  if (!totalQR) {

    paginasDiv.innerHTML = `

      <div
        style="
          max-width:1000px;
          margin:30px auto;
          background:white;
          padding:30px;
          border-radius:15px;
          text-align:center;
          color:#777;
        "
      >

        <h2>
          Nenhum QR Code selecionado
        </h2>

        <p style="margin-top:8px">

          Informe uma quantidade maior que zero
          em pelo menos uma sala.

        </p>

      </div>

    `;

    return;

  }


  /* ======================================================
     BARRA DE IMPRESSÃO
     ====================================================== */

  const barra =
    document.createElement(
      "div"
    );


  barra.id =
    "barraImpressao";


  barra.style.cssText =

    "max-width:1000px;" +
    "margin:0 auto 25px;" +
    "background:white;" +
    "padding:15px 20px;" +
    "border-radius:12px;" +
    "box-shadow:0 5px 20px rgba(0,0,0,.18);" +
    "display:flex;" +
    "align-items:center;" +
    "justify-content:space-between;" +
    "gap:15px;" +
    "flex-wrap:wrap";


  barra.innerHTML = `

    <div style="font-weight:700;color:#333">

      ✅ ${totalQR}
      QR Code${totalQR === 1 ? "" : "s"}
      selecionado${totalQR === 1 ? "" : "s"}

      — ${esc(predio)}

    </div>


    <button onclick="window.print()">

      🖨️ Imprimir / Salvar PDF

    </button>

  `;


  paginasDiv.parentNode.insertBefore(
    barra,
    paginasDiv
  );


  /* ======================================================
     MOSTRA O RESULTADO
     ====================================================== */

  barra.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}

</script>

</body>
</html>
```
