/* =====================================================

const quantidades = {};


/* =====================================================
   CARREGAR SALAS
   ===================================================== */

function carregarSalasDoPredio() {

    const predio =
        document.getElementById("predioSelect").value;

    const lista =
        document.getElementById("listaSalas");

    lista.innerHTML = "";

    if (!predio) {
        return;
    }

    quantidades[predio] = {};

    predios[predio].forEach(bloco => {

        bloco.salas.forEach(sala => {

            quantidades[predio][
                `${bloco.codigo}|${sala}`
            ] = 1;

        });

    });

    predios[predio].forEach(bloco => {

        const titulo =
            document.createElement("div");

        titulo.style.gridColumn = "1 / -1";
        titulo.style.marginTop = "12px";
        titulo.style.fontWeight = "800";
        titulo.style.color = "#8b0000";
        titulo.textContent = bloco.nome;

        lista.appendChild(titulo);


        bloco.salas.forEach(sala => {

            const chave =
                `${bloco.codigo}|${sala}`;

            const item =
                document.createElement("div");

            item.className = "sala-item";

            item.innerHTML = `

                <span class="sala-nome">
                    ${sala}
                </span>

                <input
                    type="number"
                    min="0"
                    max="999"
                    value="1"
                    data-chave="${chave}"
                    onchange="
                        quantidades['${predio}']['${chave}'] =
                        parseInt(this.value) || 0
                    "
                >

            `;

            lista.appendChild(item);

        });

    });

}


/* =====================================================

   ===================================================== */

function definirTodas(valor) {

    const predio =
        document.getElementById("predioSelect").value;

    if (!predio) {

        alert("Selecione um prédio primeiro.");

        return;
    }

    document
        .querySelectorAll("#listaSalas input")
        .forEach(input => {

            input.value = valor;

            const chave =
                input.dataset.chave;

            quantidades[predio][chave] = valor;

        });

}

        .querySelectorAll("#listaSalas input")

            const chave =
                input.dataset.chave;

            quantidades[predio][chave] = 0;

        });

}


/* =====================================================
   GERAR QR CODES
   ===================================================== */

function gerarQRCodes() {

    const predio =
        document.getElementById("predioSelect").value;

    if (!predio) {

        alert("Selecione um prédio primeiro.");

        return;
    }

    const container =
        document.getElementById("paginas");

    container.innerHTML = "";


    let totalSelecionado = 0;


    predios[predio].forEach(bloco => {

        bloco.salas.forEach(sala => {

            const chave =
                `${bloco.codigo}|${sala}`;

            const quantidade =
                parseInt(
                    quantidades[predio]?.[chave] || 0
                );

            totalSelecionado += quantidade;

        });

    });


    if (totalSelecionado === 0) {

        alert(
            "Nenhum QR Code foi selecionado."
        );

        return;
    }


    /*
     * Junta os itens de todos os blocos.
     *
     * Isso permite aproveitar completamente
     * cada página, em vez de obrigatoriamente
     * iniciar uma nova página a cada bloco.
     */

    const itens = [];


    predios[predio].forEach(bloco => {

        bloco.salas.forEach(sala => {

            const chave =
                `${bloco.codigo}|${sala}`;

            const quantidade =
                parseInt(
                    quantidades[predio]?.[chave] || 0
                );


            for (
                let i = 0;
                i < quantidade;
                i++
            ) {

                itens.push({

                    predio: predio,

                    blocoCodigo:
                        bloco.codigo,

                    blocoNome:
                        bloco.nome,

                    sala: sala

                });

            }

        });

    });


    /*
     * Cria exatamente 6 cards por página.
     *
     * 2 colunas × 3 linhas.
     *
     * O tamanho do card e do QR não é reduzido.
     */

    for (
        let inicio = 0;
        inicio < itens.length;
        inicio += CARDS_POR_PAGINA
    ) {

        const grupo =
            itens.slice(
                inicio,
                inicio + CARDS_POR_PAGINA
            );


        const pagina =
            document.createElement("div");

        pagina.className = "pagina";


        const grid =
            document.createElement("div");

        grid.className = "grid";


        grupo.forEach(item => {

            const card =
                document.createElement("div");

            card.className = "card";


            const top =
                document.createElement("div");

            top.className = "card-top";

            top.innerHTML = `
                <span class="icone">🔧</span>
                <span>CHAMADOS NTI</span>
            `;


            const body =
                document.createElement("div");

            body.className = "card-body";


            const qr =
                document.createElement("div");

            qr.className = "qrcode";


            /*
             * IMPORTANTE:
             *
             * O conteúdo original do QR permanece
             * completo:
             *
             * predio
             * bloco
             * sala
             */

            const url =
                `${URL_BASE}` +
                `?predio=${encodeURIComponent(item.predio)}` +
                `&bloco=${encodeURIComponent(item.blocoCodigo)}` +
                `&sala=${encodeURIComponent(item.sala)}`;


            new QRCode(qr, {

                text: url,

                width: 140,
                height: 140,

                colorDark: "#1a0000",
                colorLight: "#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H

            });


            const instrucao =
                document.createElement("div");

            instrucao.className =
                "card-instrucao";

            instrucao.textContent =
                "📱 Aponte a câmera do celular";


            body.appendChild(qr);

            body.appendChild(instrucao);


            const bottom =
                document.createElement("div");

            bottom.className =
                "card-bottom";


            bottom.innerHTML = `

                <div>

                    <span class="card-predio-badge">
                        PRÉDIO: ${item.predio}
                    </span>

                    <span class="card-bloco-badge">
                        BLOCO: ${item.blocoCodigo}
                    </span>

                </div>

                <div class="card-sala">
                    ${item.sala}
                </div>

            `;


            card.appendChild(top);

            card.appendChild(body);

            card.appendChild(bottom);


            grid.appendChild(card);

        });


        pagina.appendChild(grid);

        container.appendChild(pagina);

    }


    /*
     * Atualiza contador.
     */

    const barra =
        document.getElementById(
            "barraImpressao"
        );

    barra.textContent =
        `${totalSelecionado} QR Code(s) gerado(s) — pronto para impressão`;


    /*
     * Aguarda os QR Codes serem renderizados
     * antes de abrir a impressão.
     */

    setTimeout(() => {

        window.print();

    }, 500);

}


/* =====================================================
