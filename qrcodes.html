/* =========================================================
   QUANTIDADES
   ========================================================= */

const quantidades = {};


/* =========================================================
   CARREGAR SALAS
   ========================================================= */

function carregarSalasDoPredio() {

    const predio =
        document.getElementById(
            "predioSelect"
        ).value;


    const lista =
        document.getElementById(
            "listaSalas"
        );


    lista.innerHTML = "";


    if (!predio) {
        return;
    }


    quantidades[predio] = {};


    predios[predio].forEach(
        bloco => {

            bloco.salas.forEach(
                sala => {

                    quantidades[predio][
                        `${bloco.codigo}|${sala}`
                    ] = 1;

                }
            );

        }
    );


    predios[predio].forEach(
        bloco => {

            const titulo =
                document.createElement(
                    "div"
                );


            titulo.style.gridColumn =
                "1 / -1";

            titulo.style.marginTop =
                "12px";

            titulo.style.fontWeight =
                "800";

            titulo.style.color =
                "#8b0000";

            titulo.textContent =
                bloco.nome;


            lista.appendChild(
                titulo
            );


            bloco.salas.forEach(
                sala => {

                    const chave =
                        `${bloco.codigo}|${sala}`;


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "sala-item";


                    item.innerHTML = `

                        <span
                            class="sala-nome"
                        >
                            ${sala}
                        </span>

                        <input
                            type="number"
                            min="0"
                            max="999"
                            value="1"
                            data-chave="${chave}"
                        >

                    `;


                    const input =
                        item.querySelector(
                            "input"
                        );


                    input.addEventListener(
                        "change",
                        function() {

                            quantidades[predio][
                                chave
                            ] =
                                Math.max(
                                    0,
                                    Math.min(
                                        999,
                                        parseInt(
                                            this.value
                                        ) || 0
                                    )
                                );

                            this.value =
                                quantidades[predio][
                                    chave
                                ];

                        }
                    );


                    lista.appendChild(
                        item
                    );

                }
            );

        }
    );

}


/* =========================================================
   DEFINIR TODAS
   ========================================================= */

function definirTodas(valor) {

    const predio =
        document.getElementById(
            "predioSelect"
        ).value;


    if (!predio) {

        alert(
            "Selecione um prédio primeiro."
        );

        return;
    }


    document
        .querySelectorAll(
            "#listaSalas input"
        )
        .forEach(
            input => {

                input.value =
                    valor;


                const chave =
                    input.dataset.chave;


                quantidades[predio][
                    chave
                ] =
                    valor;

            }
        );

}

}


/* =========================================================
   GERAR QR CODES
   ========================================================= */

function gerarQRCodes() {

    const predio =
        document.getElementById(
            "predioSelect"
        ).value;


    if (!predio) {

        alert(
            "Selecione um prédio primeiro."
        );

        return;
    }


    const container =
        document.getElementById(
            "paginas"
        );


    container.innerHTML = "";


    /*
     * LISTA ÚNICA
     */

    const todosOsQRCodes = [];


    predios[predio].forEach(
        bloco => {

            bloco.salas.forEach(
                sala => {

                    const chave =
                        `${bloco.codigo}|${sala}`;


                    const quantidade =
                        parseInt(
                            quantidades[predio]?.[
                                chave
                            ] || 0
                        );


                    for (
                        let i = 0;
                        i < quantidade;
                        i++
                    ) {

                        todosOsQRCodes.push({

                            predio:
                                predio,

                            blocoCodigo:
                                bloco.codigo,

                            blocoNome:
                                bloco.nome,

                            sala:
                                sala

                        });

                    }

                }
            );

        }
    );


    if (
        todosOsQRCodes.length === 0
    ) {

        alert(
            "Nenhum QR Code foi selecionado."
        );

        return;
    }


    /*
     * PAGINAÇÃO GLOBAL
     */

    for (
        let inicio = 0;

        inicio < todosOsQRCodes.length;

        inicio += CARDS_POR_PAGINA
    ) {


        const grupo =
            todosOsQRCodes.slice(
                inicio,
                inicio + CARDS_POR_PAGINA
            );


        const pagina =
            document.createElement(
                "div"
            );


        pagina.className =
            "pagina";


        const grid =
            document.createElement(
                "div"
            );


        grid.className =
            "grid";


        grupo.forEach(
            item => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "card";


                /* =========================================
                   TOPO
                   ========================================= */

                const top =
                    document.createElement(
                        "div"
                    );


                top.className =
                    "card-top";


                top.innerHTML = `

                    <span class="icone">
                        🔧
                    </span>

                    <span>
                        CHAMADOS NTI
                    </span>

                `;


                /* =========================================
                   CORPO
                   ========================================= */

                const body =
                    document.createElement(
                        "div"
                    );


                body.className =
                    "card-body";


                /* =========================================
                   QR CODE
                   ========================================= */

                const qr =
                    document.createElement(
                        "div"
                    );


                qr.className =
                    "qrcode";


                /*
                 * URL COMPLETA:
                 *
                 * PRÉDIO + BLOCO + SALA
                 */

                const url =

                    `${URL_BASE}` +

                    `?predio=${encodeURIComponent(
                        item.predio
                    )}` +

                    `&bloco=${encodeURIComponent(
                        item.blocoCodigo
                    )}` +

                    `&sala=${encodeURIComponent(
                        item.sala
                    )}`;


                new QRCode(
                    qr,
                    {

                        text:
                            url,

                        width:
                            190,

                        height:
                            190,

                        colorDark:
                            "#1a0000",

                        colorLight:
                            "#ffffff",

                        correctLevel:
                            QRCode.CorrectLevel.H

                    }
                );


                /* =========================================
                   INSTRUÇÃO
                   ========================================= */

                const instrucao =
                    document.createElement(
                        "div"
                    );


                instrucao.className =
                    "card-instrucao";


                instrucao.textContent =
                    "📱 Aponte a câmera do celular";


                body.appendChild(
                    qr
                );


                body.appendChild(
                    instrucao
                );


                /* =========================================
                   RODAPÉ
                   ========================================= */

                const bottom =
                    document.createElement(
                        "div"
                    );
