  /*

   * NOMES AMIGÁVEIS

   */

  const NOMES_BLOCOS = {

    "A": "Bloco A",
    "B": "Bloco B",
    "C": "Bloco C",
    "D": "Bloco D",

    "Arquitetura":
      "Anexo da Arquitetura",

    "Medicina":
      "Complexo da Medicina",

    "SUBSOLO":
      "Subsolo",

    "TÉRREO":
      "Térreo",

    "PRIMEIRO ANDAR":
      "Primeiro Andar"

  };


  /*
   * ==========================================================
   * ELEMENTOS
   * ==========================================================
   */

  const predioSelect =
    document.getElementById("predio");

  const blocoSelect =
    document.getElementById("bloco");

  const salaSelect =
    document.getElementById("sala");

  const categoriaSelect =
    document.getElementById("categoria");

  const problemaSelect =
    document.getElementById("problema");


  /*
   * ==========================================================
   * PROBLEMAS
   * ==========================================================
   */

  const problemasPorCategoria = {

    "Sala de Aula": [
      "Projetor",
      "Computador",
      "Internet",
      "TV/Monitor",
      "Áudio/Som",
      "Cabo/Adaptador",
      "Sistema/Software",
      "Outro"
    ],

    "Administrativo": [
      "Computador",
      "Impressora",
      "Internet/Rede",
      "Sistemas",
      "E-mail",
      "Reset de Senhas",
      "Acesso/Permissão",
      "Outro"
    ]

  };


  /*
   * ==========================================================
   * CATEGORIA
   * ==========================================================
   */

  categoriaSelect.addEventListener(
    "change",
    function() {

      const categoria = this.value;

      problemaSelect.innerHTML =
        '<option value="">Selecione o problema</option>';

      if (
        categoria &&
        problemasPorCategoria[categoria]
      ) {

        problemasPorCategoria[categoria]
          .forEach(function(problema) {

            const opt =
              document.createElement("option");

            opt.value = problema;

            opt.textContent = problema;

            problemaSelect.appendChild(opt);

          });

        problemaSelect.disabled = false;

      } else {

        problemaSelect.disabled = true;

        problemaSelect.innerHTML =
          '<option value="">Selecione primeiro a categoria</option>';

      }

    }
  );


  /*
   * ==========================================================
   * PARÂMETROS DO QR CODE
   * ==========================================================
   */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const predioURL =
    params.get("predio");

  const blocoURL =
    params.get("bloco");

  const salaURL =
    params.get("sala");


  /*
   * ==========================================================
   * PRÉDIO ATIVO
   * ==========================================================
   */

  let predioAtivo = "SEDE";


  /*
   * ==========================================================
   * VERIFICA SE O PRÉDIO DO QR CODE EXISTE
   * ==========================================================
   */

  const qrPredioValido =
    predioURL &&
    Object.prototype.hasOwnProperty.call(
      estrutura,
      predioURL
    );


  /*
   * ==========================================================
   * DEFINE O PRÉDIO ATIVO
   * ==========================================================
   */

  if (qrPredioValido) {

    predioAtivo = predioURL;

  }


  /*
   * ==========================================================
   * CARREGA BLOCOS
   * ==========================================================
   */

  function carregarBlocos() {

    blocoSelect.innerHTML =
      '<option value="">Selecione o bloco</option>';

    const blocos =
      Object.keys(
        estrutura[predioAtivo] || {}
      );


    blocos.forEach(
      b => {

        const opt =
          document.createElement("option");

        opt.value = b;

        opt.textContent =
          NOMES_BLOCOS[b] || b;

        blocoSelect.appendChild(opt);

      }
    );

  }


  /*
   * ==========================================================
   * CARREGA SALAS
   * ==========================================================
   */

  function carregarSalas(
    bloco,
    salaPreSelecionada
  ) {

    salaSelect.innerHTML =
      '<option value="">Selecione a sala</option>';


    if (
      bloco &&
      estrutura[predioAtivo] &&
      estrutura[predioAtivo][bloco]
    ) {

      estrutura[predioAtivo][bloco]
        .forEach(
          sala => {

            const opt =
              document.createElement(
                "option"
              );

            opt.value = sala;

            opt.textContent = sala;


            if (
              salaPreSelecionada &&
              sala === salaPreSelecionada
            ) {

              opt.selected = true;

            }


            salaSelect.appendChild(opt);

          }
        );


      salaSelect.disabled = false;

    } else {

      salaSelect.disabled = true;

    }

  }


  /*
   * ==========================================================
   * ALTERAÇÃO MANUAL DO PRÉDIO
   * ==========================================================
   */

  predioSelect.addEventListener(
    "change",
    function() {

      /*
       * Se o prédio veio de QR Code,
       * não permite alteração.
       */

      if (qrPredioValido) {

        this.value = predioAtivo;

        return;

      }


      predioAtivo =
        this.value;

      carregarBlocos();


      salaSelect.innerHTML =
        '<option value="">Selecione primeiro o bloco</option>';

      salaSelect.disabled = true;


      blocoSelect.disabled = false;

      blocoSelect.classList.remove(
        "bloqueado"
      );


      salaSelect.classList.remove(
        "bloqueado"
      );


      document.getElementById(
        "badgePredio"
      ).innerHTML = "";


      document.getElementById(
        "badgeBloco"
      ).innerHTML = "";


      document.getElementById(
        "badgeSala"
      ).innerHTML = "";

    }
  );


  /*
   * ==========================================================
   * INICIALIZA BLOCOS
   * ==========================================================
   */

  carregarBlocos();


  /*
   * ==========================================================
   * QR CODE:
   * TRAVA PRÉDIO
   * ==========================================================
   */

  if (qrPredioValido) {

    /*
     * Define o valor do prédio
     */
    predioSelect.value =
      predioURL;


    /*
     * Adiciona aparência de bloqueado
     */
    predioSelect.classList.add(
      "bloqueado"
    );


    /*
     * DESABILITA O SELECT
     */
    predioSelect.disabled = true;


    /*
     * Mostra identificação do QR Code
     */
    document.getElementById(
      "badgePredio"
    ).innerHTML =
      '<span class="badge-qr">📱 QR Code</span>';

  }


  /*
   * ==========================================================
   * QR CODE:
   * BLOCO
   * ==========================================================
   */

  const qrBlocoValido =
    qrPredioValido &&
    blocoURL &&
    estrutura[predioAtivo] &&
    Object.prototype.hasOwnProperty.call(
      estrutura[predioAtivo],
      blocoURL
    );


  if (qrBlocoValido) {

    /*
     * Define o bloco
     */
    blocoSelect.value =
      blocoURL;


    /*
     * Aparência de bloqueado
     */
    blocoSelect.classList.add(
      "bloqueado"
    );


    /*
     * Bloqueia o bloco
     */
    blocoSelect.disabled = true;


    /*
     * Badge
     */
    document.getElementById(
      "badgeBloco"
    ).innerHTML =
      '<span class="badge-qr">📱 QR Code</span>';


    /*
     * Carrega as salas do bloco
     */
    carregarSalas(
      blocoURL,
      salaURL
    );


    /*
     * ========================================================
     * QR CODE:
     * SALA
     * ========================================================
     */

    const qrSalaValida =
      salaURL &&
      estrutura[predioAtivo][blocoURL].includes(
        salaURL
      );


    if (qrSalaValida) {

      /*
       * Define a sala
       */
      salaSelect.value =
        salaURL;


      /*
       * Aparência de bloqueado
       */
      salaSelect.classList.add(
        "bloqueado"
      );


      /*
       * Bloqueia a sala
       */
      salaSelect.disabled = true;


      /*
       * Badge
       */
      document.getElementById(
        "badgeSala"
      ).innerHTML =
        '<span class="badge-qr">📱 QR Code</span>';

    }

  }


  /*
   * ==========================================================
   * ALTERAÇÃO MANUAL DO BLOCO
   * ==========================================================
   */

  blocoSelect.addEventListener(
    "change",
    function() {

      /*
       * Se o bloco veio do QR Code,
       * não permite alteração.
       */

      if (qrBlocoValido) {

        this.value = blocoURL;
